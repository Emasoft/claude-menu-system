[project]
name = "claude-menu-system"
version = "0.2.1"
description = "Universal terminal-menu system for Claude Code plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Emanuele Sabetta", email = "713559+Emasoft@users.noreply.github.com" },
]
keywords = ["claude-code", "plugin", "menu", "tui", "rendering", "ansi", "hooks"]

# Runtime: stdlib only. No third-party deps. This keeps the hook script
# fast to load and removes any uv/pip dependency on the user's machine.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "ruff>=0.5",
  # mypy required by the canonical CPV CI pipeline's `uv sync --extra dev` step —
  # CI runs `uv run mypy` against scripts/. Without this, the workflow crashes
  # with "Failed to spawn: mypy" on first push (per standardize_plugin v2.87.1
  # [ACTION REQUIRED] alert).
  "mypy>=1.19.1",
]

[project.urls]
Homepage = "https://github.com/Emasoft/claude-menu-system"
Repository = "https://github.com/Emasoft/claude-menu-system"
Issues = "https://github.com/Emasoft/claude-menu-system/issues"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package contents are scripts/ — but this project isn't installed
# as a Python package, it's installed as a Claude Code plugin. The
# wheel build is only used by CI for sdist-style consistency checks.
packages = ["scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
# Make scripts/ importable in tests without a conftest hack.
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
  "E501",  # line length handled by formatter
  "E402",  # module-level import after sys.path tweak (intentional)
]

[tool.ruff.lint.per-file-ignores]
# RUF001-003: tests intentionally include confusable Unicode as test data.
"tests/**" = ["B017", "RUF001", "RUF002", "RUF003"]
# Renderer docstrings use × as multiplication sign in "category × severity matrix"
# which is the standard math notation. Suppress the lint, not the meaning.
"scripts/menu_render.py" = ["RUF002"]
# cpv_network_resilience.py + publish.py are vendored verbatim from the
# canonical CPV scaffold via standardize_plugin --force-templates. Lint
# noise in those files is upstream's concern, not ours — silencing here
# keeps `uv run ruff check .` clean without touching the canonical text
# (which would create drift the next time we re-run --force-templates).
# RUF002: docstrings use × for "N×M" multiplication notation.
# UP037: quoted forward-reference annotation kept for Python 3.10 compat.
"scripts/cpv_network_resilience.py" = ["RUF002", "UP037"]

# --- bandit (Mega-Linter `bandit` linter reads this table) ---
#
# B101 (assert_used) is universally false-positive in a pytest suite —
# pytest's entire testing primitive IS `assert <expr>`. The bandit
# warning is about "asserts get stripped under python -O" which doesn't
# apply to test code that never runs under -O. We skip B101 only for
# tests/, not for scripts/ — production asserts would still be flagged.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# Per-rule skip kept narrow: B101 only. Other bandit checks (subprocess,
# input handling, weak crypto, etc.) STAY ACTIVE everywhere.
skips = ["B101"]
