name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: uv run pytest tests/ -n auto --tb=short
        env:
          CLAUDE_MENU_COLOR: "0"
          TERM: xterm-256color
          LANG: en_US.UTF-8

  validate-plugin:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify .claude-plugin/plugin.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; assert json.load(open('.claude-plugin/plugin.json'))['name'] == 'claude-menu-system'"

      - name: Verify hooks/hooks.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('hooks/hooks.json'))"
          python3 -c "
          import json
          h = json.load(open('hooks/hooks.json'))['hooks']
          for k in ('SubagentStop', 'Stop', 'StopFailure'):
            assert k in h, f'missing hook event: {k}'
          print('hooks: SubagentStop + Stop + StopFailure all wired')
          "

      - name: Verify skill frontmatter
        run: |
          python3 -c "
          import re, sys
          p = 'skills/render-menu/SKILL.md'
          content = open(p).read()
          m = re.search(r'^---\n(.*?)\n---', content, re.DOTALL)
          assert m, f'{p}: no frontmatter'
          fm = m.group(1)
          for key in ('name:', 'context: fork', 'model: haiku', 'agent:', 'user-invocable: false'):
            assert key in fm, f'{p}: missing or wrong: {key}'
          print('skill frontmatter: ok')
          "
